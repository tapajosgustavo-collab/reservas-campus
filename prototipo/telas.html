<!doctype html>
<!--
  PROTÓTIPO DESCARTÁVEL. Não é código de produção e não vai para a main.
  Ticket: "Protótipo das telas principais" (issue #8 do mapa #1).

  Pergunta: como devem ser e como devem se comportar as três telas centrais?
  Plano: 3 variantes de cada tela, trocadas pela barra flutuante (◀ ▶ ou setas do teclado),
  num único HTML sem dependências. Dê dois cliques para abrir.
    - Agenda semanal do Recurso:  ?agenda=A|B|C
    - Criação de Reserva:         ?reserva=A|B|C
    - Fila de Pedidos do Gestor:  ?fila=A|B|C
  Dados falsos em memória, "agora" fixo em seg 26/10/2026 09:00. As regras RN01–RN13
  são simuladas aqui só para as mensagens aparecerem; nada disso é a implementação.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTÓTIPO · Telas do Reservas do Campus</title>

/* fila */
.fila-cab{margin-bottom:12px}

.linha-bts{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}

.fb-item{text-align:left;background:#fff;border:1px solid var(--borda);border-radius:8px;padding:10px;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:2px}

<body>
<div id="app"></div>
<div id="toasts"></div>
<script>
// ---------- utilidades de data (tudo em minutos desde 00:00) ----------
const pad=n=>String(n).padStart(2,'0');
const DS=['dom','seg','ter','qua','qui','sex','sáb'];
const DSL=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const PLUR=['aos domingos','às segundas','às terças','às quartas','às quintas','às sextas','aos sábados'];
const AGORA_DIA='2026-10-26', AGORA_MIN=9*60;
const SEMANA=['2026-10-26','2026-10-27','2026-10-28','2026-10-29','2026-10-30','2026-10-31'];
const h=(H,M=0)=>H*60+M;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDias=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const difDias=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const abs=(dia,min)=>difDias(dia,AGORA_DIA)*1440+min;
const fDia=s=>{const d=pd(s);return DS[d.getDay()]+' '+pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const fDiaL=s=>{const d=pd(s);return DSL[d.getDay()]+', '+pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const hm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const fDur=m=>{const H=Math.floor(m/60),r=m%60;return H?(r?H+'h'+pad(r):H+'h'):r+' min'};
const fRest=m=>{if(m<=0)return 'prazo vencido';if(m<60)return m+' min';if(m<1440)return fDur(m);const d=Math.floor(m/1440);return d+(d>1?' dias':' dia')};
const urg=m=>m<120?'verm':m<1440?'amar':'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- dados falsos ----------
const ATIVAS=['Pendente','Confirmada','Em uso'];
const POL={Aluno:{antMin:60,antMaxD:14,durMax:{'Espaço':120,'Equipamento':240},cota:3},
           Docente:{antMin:60,antMaxD:60,durMax:{'Espaço':240,'Equipamento':480},cota:10}};
const CEN={normal:'Normal',cota:'Aluno com Cota cheia',suspenso:'Aluno suspenso'};
const JUST=['O Recurso está reservado para uma atividade acadêmica nesse horário','O número de participantes não é adequado ao Recurso','A finalidade não é compatível com o Recurso','Faltam informações: descreva melhor a atividade'];
const VAR={agenda:{A:'Grade semanal',B:'Lista do dia (celular primeiro)',C:'Linha do tempo + próximos livres'},
           reserva:{A:'Janela com erros ao enviar',B:'Página com checklist ao vivo',C:'Barra de confirmação rápida'},
           fila:{A:'Tabela com ações na linha',B:'Caixa de entrada com contexto',C:'Triagem um por vez'}};
const NOMETELA={agenda:'Agenda',reserva:'Criação de Reserva',fila:'Fila de Pedidos'};
let ID=100;

function dadosIniciais(cenario){
  ID=100;
  const UTIL={1:[h(7),h(23)],2:[h(7),h(23)],3:[h(7),h(23)],4:[h(7),h(23)],5:[h(7),h(23)]};
  const d={
    usuarios:{
      ana:{nome:'Ana Souza',perfil:'Aluno',email:'ana.souza@unifesp.br'},
      bruno:{nome:'Bruno Lima',perfil:'Aluno',email:'bruno.lima@unifesp.br'},
      julia:{nome:'Júlia Castro',perfil:'Aluno',email:'julia.castro@unifesp.br'},
      marcos:{nome:'Marcos Oliveira',perfil:'Docente',email:'marcos.oliveira@unifesp.br'},
      paula:{nome:'Paula Reis',perfil:'Docente',email:'paula.reis@unifesp.br'},
      lucas:{nome:'Lucas Ferreira',perfil:'Docente',email:'lucas.ferreira@unifesp.br'},
      carla:{nome:'Carla Mendes',perfil:'Gestor',email:'carla.mendes@unifesp.br'}},
    penalidades:[

function validar(d){
  const u=uid(), perfil=S.usuarios[u].perfil, p=POL[perfil], rec=recurso(d.recurso), ck=[];
  const add=(rn,nome,ok,msg,campo)=>ck.push({rn,nome,ok,msg,campo});
  const susp=S.suspensoes[u];
  add('RN09','Suspensão',!susp,susp?`Você está suspenso até ${fDia(susp)} (3 Penalidades em 30 dias) e não pode criar Reservas.`:'Você não está suspenso.',null);
  const ok2=d.fim>d.ini&&d.ini%30===0&&d.fim%30===0;
  add('RN02','Intervalo válido',ok2,d.fim<=d.ini?'O fim precisa ser depois do início.':!ok2?'Início e fim precisam ser múltiplos de 30 minutos.':`${hm(d.ini)}–${hm(d.fim)}, ${fDur(d.fim-d.ini)}.`,'fim');
  const wd=pd(d.dia).getDay(), f=rec.func[wd], ok3=!!f&&d.ini>=f[0]&&d.fim<=f[1];
  add('RN03','Horário de funcionamento',ok3,!f?`${rec.nome} não funciona ${PLUR[wd]}.`:ok3?`Funciona das ${hm(f[0])} às ${hm(f[1])} nesse dia.`:`${rec.nome} funciona das ${hm(f[0])} às ${hm(f[1])} ${PLUR[wd]}; o Intervalo precisa caber nesse horário.`,'ini');
  const ind=S.indisp.find(i=>i.recurso===rec.id&&i.dia===d.dia&&i.ini<d.fim&&d.ini<i.fim);
  add('RN04','Indisponibilidade',!ind,ind?`O Recurso está indisponível ${fDia(d.dia)} das ${hm(ind.ini)} às ${hm(ind.fim)} (${ind.motivo}).`:'Sem Indisponibilidade no Intervalo.','ini');
  const conf=S.reservas.find(r=>r.recurso===rec.id&&r.dia===d.dia&&ATIVAS.includes(r.status)&&r.ini<d.fim&&d.ini<r.fim);
  add('RN01','Conflito',!conf,conf?(conf.usuario===u?`Você já tem uma Reserva neste Recurso das ${hm(conf.ini)} às ${hm(conf.fim)}.`:`O Recurso já está ocupado das ${hm(conf.ini)} às ${hm(conf.fim)}.`):'Nenhuma outra Reserva no Intervalo.','ini');
  const a=abs(d.dia,d.ini)-AGORA_MIN, maxA=p.antMaxD*1440;
  add('RN05','Antecedência',a>=p.antMin&&a<=maxA,a<0?'Esse horário já passou.':a<p.antMin?`O início precisa ser daqui a pelo menos 1 hora (agora são ${hm(AGORA_MIN)} de ${fDia(AGORA_DIA)}).`:a>maxA?`O ${perfil} pode reservar com até ${p.antMaxD} dias de antecedência (até ${fDia(addDias(AGORA_DIA,p.antMaxD))}).`:`Começa daqui a ${fRest(a)}.`,'dia');
  const dur=d.fim-d.ini, mx=p.durMax[rec.tipo];
  add('RN06','Duração máxima',dur<=mx,dur>mx?`O ${perfil} pode reservar ${rec.tipo==='Espaço'?'um Espaço':'um Equipamento'} por no máximo ${fDur(mx)}; você pediu ${fDur(dur)}.`:`Até ${fDur(mx)} para ${perfil} em ${rec.tipo}.`,'fim');
  const at=ativasDe(u).length;
  add('RN07','Cota',at<p.cota,at>=p.cota?`Você já tem ${at} Reservas ativas; o limite do ${perfil} é ${p.cota}. Cancele uma para fazer outra.`:`Você tem ${at} de ${p.cota} Reservas ativas.`,null);
  if(rec.tipo==='Espaço'){
    const n=parseInt(d.participantes,10);
    if(!n||n<1) add('RN08','Capacidade',false,'Informe o número de participantes.','participantes');
    else add('RN08','Capacidade',n<=rec.cap,n>rec.cap?`${rec.nome} comporta ${rec.cap} pessoas; você informou ${n}.`:`${n} de ${rec.cap} lugares.`,'participantes');
  } else add('RN08','Capacidade',null,'Não se aplica a Equipamento.',null);
  return ck;
}
const falhas=d=>validar(d).filter(c=>c.ok===false);
// sugestão de horário parecido que passa nas regras de tempo
function sugerir(d,errs){
  if(!errs.some(e=>['RN01','RN02','RN03','RN04','RN05','RN06'].includes(e.rn))) return null;
  if(errs.some(e=>['RN09','RN07'].includes(e.rn))) return null;
  const rec=recurso(d.recurso), p=POL[S.usuarios[uid()].perfil];
  const dur=Math.min(Math.max(d.fim-d.ini,60),p.durMax[rec.tipo]);
  for(let k=0;k<7;k++){
    const dia=addDias(d.dia,k), f=rec.func[pd(dia).getDay()]; if(!f) continue;
    const cands=[]; for(let t=f[0];t+dur<=f[1];t+=30) cands.push(t);
    cands.sort((x,y)=>Math.abs(x-d.ini)-Math.abs(y-d.ini));
    for(const t of cands){const c={...d,dia,ini:t,fim:t+dur}; if(!falhas(c).some(e=>e.rn!=='RN08')) return c;}
  }
  return null;
}

// ---------- estado de cada meia hora na agenda ----------
function statusCel(rec,dia,t){
  const f=rec.func[pd(dia).getDay()];
  if(!f||t<f[0]||t>=f[1]) return {tipo:'fechado',key:'fechado'};
  if(abs(dia,t)+30<=AGORA_MIN) return {tipo:'passado',key:'passado'};
  const ind=S.indisp.find(i=>i.recurso===rec.id&&i.dia===dia&&i.ini<t+30&&t<i.fim);
  if(ind) return {tipo:'indisp',key:'i'+ind.id,ind};
  const r=S.reservas.find(r=>r.recurso===rec.id&&r.dia===dia&&ATIVAS.includes(r.status)&&r.ini<t+30&&t<r.fim);
  if(r) return {tipo:'ocupado',key:'r'+r.id,r};
  return {tipo:'livre',key:'livre'};
}
// RN22: nomes só para o dono e para o Gestor do Recurso
function rotulo(st,rec){
  const u=uid();
  if(st.tipo==='ocupado'){const r=st.r;
    if(r.usuario===u) return {cls:r.status==='Pendente'?'c-meupend':'c-meu',txt:'Sua reserva',sub:r.status};
    if(rec.gestor===u) return {cls:r.status==='Pendente'?'c-pend':'c-ocupado',txt:S.usuarios[r.usuario].nome,sub:r.status};
    return {cls:'c-ocupado',txt:'Ocupado',sub:''};}
  if(st.tipo==='indisp') return {cls:'c-indisp',txt:'Indisponível',sub:st.ind.motivo};
  if(st.tipo==='fechado') return {cls:'c-fechado',txt:'Fechado',sub:''};
  if(st.tipo==='passado') return {cls:'c-passado',txt:'',sub:'já passou'};
  return {cls:'c-livre',txt:'Livre',sub:''};
}
function segmentos(rec,dia,de,ate,juntarLivres){
  const out=[];
  for(let t=de;t<ate;t+=30){const st=statusCel(rec,dia,t);const k=st.tipo==='livre'&&!juntarLivres?'livre'+t:st.key;const ult=out[out.length-1];
    if(ult&&ult.key===k) ult.fim=t+30; else out.push({key:k,ini:t,fim:t+30,st});}
  return out;
}
function faixa(rec){let de=1440,ate=0;SEMANA.forEach(d=>{const f=rec.func[pd(d).getDay()];if(f){de=Math.min(de,f[0]);ate=Math.max(ate,f[1])}});return {de,ate}}

    SEMANA.forEach((d,i)=>{const g=segs[i].find(x=>x.ini===t); if(!g) return;

function barra(rec,dia,de,ate,clicavel,destaque){
  const W=ate-de;
  const segs=segmentos(rec,dia,de,ate,true).map(g=>{const ro=rotulo(g.st,rec),w=(g.fim-g.ini)/W*100;
    return `<div class="tl-seg ${ro.cls} ${g.st.r&&destaque&&g.st.r.id===destaque.id?'destaque':''} ${g.st.r&&g.st.r.id===S.novo?'novo':''}" style="left:${(g.ini-de)/W*100}%;width:${w}%" title="${hm(g.ini)}–${hm(g.fim)} · ${esc(ro.txt||'já passou')} ${esc(ro.sub)}">${w>10&&g.st.tipo!=='livre'&&g.st.tipo!=='passado'?esc(ro.txt):''}</div>`}).join('');
  const agora=dia===AGORA_DIA?`<div class="tl-agora" style="left:${(AGORA_MIN-de)/W*100}%" title="agora"></div>`:'';
  const d=S.draft, sel=clicavel&&S.tela==='reserva'&&d&&d.recurso===rec.id&&d.dia===dia?`<div class="tl-sel" style="left:${(d.ini-de)/W*100}%;width:${(d.fim-d.ini)/W*100}%"></div>`:'';
  return `<div class="tl-barra" ${clicavel?`data-act="barra" data-dia="${dia}" data-de="${de}" data-ate="${ate}"`:''}>${segs}${agora}${sel}</div>`;
}
function escala(de,ate,semDia){let s='';for(let H=Math.ceil(de/60);H<=ate/60;H+=2)s+=`<span style="left:${(H*60-de)/(ate-de)*100}%">${H}h</span>`;return `<div class="tl-escala" ${semDia?'style="margin-left:0"':''}>${s}</div>`}
function proximosLivres(rec,n){
  const out=[], {de,ate}=faixa(rec);
  for(const dia of SEMANA){for(const g of segmentos(rec,dia,de,ate,true)){if(g.st.tipo!=='livre')continue;
    let t=g.ini; while(abs(dia,t)<AGORA_MIN+60) t+=30;
    if(t+60<=g.fim) out.push({dia,t}); if(out.length>=n) return out;}}
  return out;
}
function agendaC(rec){
  const {de,ate}=faixa(rec);
  const prox=proximosLivres(rec,6).map(p=>`<button class="chip" data-act="prox" data-dia="${p.dia}" data-t="${p.t}">${p.dia===AGORA_DIA?'Hoje':p.dia===addDias(AGORA_DIA,1)?'Amanhã':fDia(p.dia)} · ${hm(p.t)}</button>`).join('');
  return `<div class="tl"><div class="prox"><b>Próximos horários livres (1h):</b> ${prox||'<span class="mini">nenhum nesta semana</span>'}</div>
  ${escala(de,ate)}${SEMANA.map(d=>`<div class="tl-linha"><div class="tl-dia ${d===AGORA_DIA?'hoje':''}">${fDia(d)}</div>${barra(rec,d,de,ate,true)}</div>`).join('')}</div>`;
}

function campos(d,ec){

  const opts=(sel,de,ate)=>{let o='';for(let t=de;t<=ate;t+=30)o+=`<option value="${t}" ${t===sel?'selected':''}>${hm(t)}</option>`;return o};
  return `<label>Recurso<select data-campo="recurso">${S.recursos.map(r=>`<option value="${r.id}" ${r.id===d.recurso?'selected':''}>${r.nome}${r.restrito?' (restrito)':''}</option>`).join('')}</select></label>

  <div class="dupla"><label class="${e('ini')}">Início<select data-campo="ini">${opts(d.ini,h(6),h(23,30))}</select></label>
  <label class="${e('fim')}">Fim<select data-campo="fim">${opts(d.fim,h(6,30),h(24))}</select></label></div>
  ${rec.tipo==='Espaço'?`<label class="${e('participantes')}">Participantes <small>(até ${rec.cap})</small><input type="number" min="1" data-campo="participantes" value="${esc(d.participantes)}" placeholder="Quantas pessoas?"></label>`:''}
  <label>Finalidade <small>(opcional)</small><input type="text" data-campo="finalidade" value="${esc(d.finalidade)}" placeholder="Ex.: reunião do grupo de projeto"></label>`;
}

function reservaB(){

function checklist(){

}
function reservaC(){

  return `<div class="sheet"><div class="sh-l1"><b>${rec.nome}</b><span class="mini">${rec.tipo}${rec.restrito?' · restrito':''}</span><button class="x" data-act="cancelar" title="Fechar">×</button></div>
  <div class="sh-l2"><span>${fDiaL(d.dia)}</span><span class="sh-hora">${hm(d.ini)}–${hm(d.fim)}</span><span class="mini">${fDur(Math.max(0,d.fim-d.ini))}</span></div>
  <div class="sh-ctl"><span>Mover</span><button data-act="mover" data-n="-30">◀ 30 min</button><button data-act="mover" data-n="30">30 min ▶</button><span class="sep"></span>

// ---------- fila do Gestor ----------
function solic(u,comPen=true){const x=S.usuarios[u],n=pen30(u).length;return `${x.nome} <span class="badge">${x.perfil}</span>${comPen&&n?` <span class="badge verm">${n} Penalidade${n>1?'s':''} em 30 dias</span>`:''}`}
function formRecusa(r,chips){
  const v=S.justTxt||'';
  return `<div class="recusa"><label>Justificativa da Recusa <small>(obrigatória; vai na Notificação para ${S.usuarios[r.usuario].nome} · RN11)</small>

  <textarea data-just rows="2" placeholder="Explique por que o Pedido foi recusado">${esc(v)}</textarea></label>
  <div class="linha-bts"><button class="bt" data-act="cancRecusa">Cancelar</button><button class="bt perigo" data-act="confRecusa" data-id="${r.id}" ${v.trim()?'':'disabled'}>Recusar pedido</button></div></div>`;
}
function fila(){
  const ps=pedidos();
  const corpo=ps.length?({A:filaA,B:filaB,C:filaC})[S.v.fila](ps):'<div class="vazio">Nenhum Pedido pendente.</div>';
  const dec=S.decididos.length?`<div class="decididos"><h3>Decididos nesta sessão</h3><ul class="mini">${S.decididos.map(x=>`<li><b>${x.acao}</b> · ${recurso(x.r.recurso).nome}, ${fDia(x.r.dia)} ${hm(x.r.ini)}–${hm(x.r.fim)} · ${S.usuarios[x.r.usuario].nome}${x.just?` · “${esc(x.just)}”`:''}</li>`).join('')}</ul></div>`:'';
  return `<main class="pag"><div class="fila-cab"><h1>Pedidos dos seus Recursos</h1><p class="mini">${ps.length} pendente${ps.length===1?'':'s'} · do início mais próximo para o mais distante · cada Pedido expira 2h antes do início (RN12)</p></div>${corpo}${dec}</main>`;
}
function filaA(ps){
  const todos=ps.every(r=>S.selA.has(r.id));
  return `<div class="fa-acoes"><button class="bt ok" data-act="aprovarSel" ${S.selA.size?'':'disabled'}>Aprovar selecionados (${S.selA.size})</button><span class="mini">A Recusa é sempre individual, porque cada uma precisa de justificativa.</span></div>
  <div class="tab-wrap"><table class="tabela"><thead><tr><th><input type="checkbox" data-act="selTodos" ${todos?'checked':''}></th><th>Início</th><th>Expira em</th><th>Recurso</th><th>Solicitante</th><th>Pessoas</th><th>Finalidade</th><th></th></tr></thead><tbody>
  ${ps.map(r=>{const rec=recurso(r.recurso),rest=restante(r);
    return `<tr><td><input type="checkbox" data-act="selA" data-id="${r.id}" ${S.selA.has(r.id)?'checked':''}></td><td class="nowrap"><b>${fDia(r.dia)}</b><br>${hm(r.ini)}–${hm(r.fim)}</td><td><span class="badge ${urg(rest)}">${fRest(rest)}</span></td><td>${rec.nome}</td><td>${solic(r.usuario)}</td><td>${r.participantes??'–'}${rec.cap?' / '+rec.cap:''}</td><td>${esc(r.finalidade)}</td>
    <td class="nowrap"><button class="bt ok" data-act="aprovar" data-id="${r.id}">Aprovar</button> <button class="bt" data-act="recusar" data-id="${r.id}">Recusar</button></td></tr>
    ${S.recusando===r.id?`<tr class="recusa-linha"><td></td><td colspan="7">${formRecusa(r,false)}</td></tr>`:''}`}).join('')}
  </tbody></table></div>`;
}
function detalhe(r){
  const rec=recurso(r.recurso), u=S.usuarios[r.usuario], pens=pen30(r.usuario), rest=restante(r), {de,ate}=faixa(rec);
  return `<div class="det-cab"><div><h2>${rec.nome}</h2><div>${fDiaL(r.dia)} · ${hm(r.ini)}–${hm(r.fim)} (${fDur(r.fim-r.ini)})</div></div><span class="badge grande ${urg(rest)}">expira em ${fRest(rest)}</span></div>
  <p class="mini">Prazo de decisão: ${fPrazo(r)} (2h antes do início, RN12).</p>
  <div class="det-grid"><section><h4>Solicitante</h4><p>${u.nome} <span class="badge">${u.perfil}</span><br><span class="mini">${u.email}</span></p>
  <p>Reservas ativas: ${ativasDe(r.usuario).length} de ${POL[u.perfil].cota}</p>
  <p>${pens.length?`<span class="badge verm">${pens.length} Penalidade${pens.length>1?'s':''} nos últimos 30 dias</span></p><ul class="mini">${pens.map(p=>`<li>${fDia(p.data)}: ${p.motivo}</li>`).join('')}</ul>`:'Sem Penalidades nos últimos 30 dias.</p>'}</section>
  <section><h4>Pedido</h4><p>${esc(r.finalidade)||'<i>sem finalidade</i>'}</p><p>${r.participantes} pessoas · Capacidade ${rec.cap}</p></section></div>
  <h4>Agenda do Recurso em ${fDia(r.dia)}</h4>${escala(de,ate,true)}<div class="tl-linha" style="margin:0">${barra(rec,r.dia,de,ate,false,r)}</div>
  <div class="det-acoes">${S.recusando===r.id?formRecusa(r,true):`<button class="bt" data-act="recusar" data-id="${r.id}">Recusar…</button><button class="bt ok grande" data-act="aprovar" data-id="${r.id}">Aprovar</button>`}</div>`;
}
function filaB(ps){
  const sel=ps.find(r=>r.id===S.pedSel)||ps[0];
  let lista='', grupo=null;
  ps.forEach(r=>{const g=r.dia===AGORA_DIA?'Hoje':r.dia===addDias(AGORA_DIA,1)?'Amanhã':fDia(r.dia);
    if(g!==grupo){lista+=`<div class="fb-grupo">${g}</div>`;grupo=g}
    const rest=restante(r);
    lista+=`<button class="fb-item ${r.id===sel.id?'on':''}" data-act="pedSel" data-id="${r.id}"><div><b>${hm(r.ini)}–${hm(r.fim)}</b> <span class="badge ${urg(rest)}">${fRest(rest)}</span></div><div>${recurso(r.recurso).nome}</div><div class="mini">${S.usuarios[r.usuario].nome} · ${S.usuarios[r.usuario].perfil}${pen30(r.usuario).length?' · ⚠ Penalidades':''}</div></button>`;});
  return `<div class="fb"><div class="fb-lista">${lista}</div><div class="card">${detalhe(sel)}</div></div>`;
}
function filaC(ps){
  const i=Math.min(S.triIdx,ps.length-1); S.triIdx=i;
  const r=ps[i], rec=recurso(r.recurso), rest=restante(r);
  return `<div class="tri"><div class="tri-prog"><div style="width:${(i+1)/ps.length*100}%"></div></div><div class="mini">Pedido ${i+1} de ${ps.length} · atalhos: A aprova · R recusa · P pula</div>
  <div class="tri-card card"><div class="tri-tempo ${urg(rest)}"><small>expira em</small><b>${fRest(rest)}</b></div>
  <h2>${rec.nome}</h2><div class="tri-quando">${fDiaL(r.dia)}, ${hm(r.ini)}–${hm(r.fim)}</div><div>${solic(r.usuario)}</div>
  <p>“${esc(r.finalidade)}”</p><p class="mini">${r.participantes} de ${rec.cap} lugares · ${ativasDe(r.usuario).length} Reservas ativas</p>
  ${S.recusando===r.id?formRecusa(r,true):`<div class="tri-bts"><button class="bt perigo grande" data-act="recusar" data-id="${r.id}">Recusar</button><button class="bt grande" data-act="pular">Pular</button><button class="bt ok grande" data-act="aprovar" data-id="${r.id}">Aprovar</button></div>`}</div></div>`;
}
function aprovar(id,silencioso){
  const r=S.reservas.find(x=>x.id===id); r.status='Confirmada';
  const msg=`Seu pedido do ${recurso(r.recurso).nome} para ${fDia(r.dia)} ${hm(r.ini)}–${hm(r.fim)} foi aprovado.`;
  S.notificacoes.unshift({para:r.usuario,msg}); S.decididos.unshift({r,acao:'Aprovado'}); S.selA.delete(id); S.recusando=null;
  if(!silencioso) toast(`Aprovado. Notificação para ${S.usuarios[r.usuario].nome}: “${msg}”`,'verde');
}
function recusar(id){
  const just=(S.justTxt||'').trim();
  if(!just){toast('RN11 · Recusa justificada: escreva a justificativa antes de recusar.','verm');return}
  const r=S.reservas.find(x=>x.id===id); r.status='Recusada';
  const msg=`Seu pedido do ${recurso(r.recurso).nome} para ${fDia(r.dia)} ${hm(r.ini)}–${hm(r.fim)} foi recusado: ${just}`;
  S.notificacoes.unshift({para:r.usuario,msg}); S.decididos.unshift({r,acao:'Recusado',just}); S.selA.delete(id); S.recusando=null; S.justTxt='';
  toast(`Recusado. Notificação para ${S.usuarios[r.usuario].nome}: “${msg}”`,'amar'); render();
}

// ---------- criação ----------
function abrirReserva(p){
  if(S.perfil==='Gestor'){toast('O Gestor não cria Reservas. Para eventos institucionais, use Indisponibilidade.','amar');return}
  S.draft={recurso:S.recursoSel,dia:p.dia,ini:p.ini,fim:p.fim,participantes:S.draft&&S.draft.recurso===S.recursoSel?S.draft.participantes:'',finalidade:''};
  S.erros=null; go('reserva');
}
function enviar(){
  const errs=falhas(S.draft);
  if(errs.length){S.erros=errs;render();return}
  const d=S.draft, rec=recurso(d.recurso), st=rec.restrito?'Pendente':'Confirmada';
  const r={id:++ID,recurso:rec.id,usuario:uid(),dia:d.dia,ini:d.ini,fim:d.fim,status:st,participantes:rec.tipo==='Espaço'?+d.participantes:null,finalidade:d.finalidade||''};
  S.reservas.push(r); S.novo=r.id; S.recursoSel=rec.id; if(SEMANA.includes(d.dia)) S.diaSel=d.dia;
  const quando=`${fDia(d.dia)} ${hm(d.ini)}–${hm(d.fim)}`;
  if(st==='Pendente') toast(`Pedido enviado: ${rec.nome}, ${quando}. ${nomeGestor(rec)} precisa decidir até ${fPrazo(r)}; senão o Pedido expira.`,'amar');
  else toast(`Reserva Confirmada: ${rec.nome}, ${quando}. Check-in de ${hm(d.ini-15)} a ${hm(d.ini+15)}.`,'verde');
  S.draft=null; S.erros=null; go('agenda');
}

// ---------- barra do protótipo ----------
function switcher(){
  const k=S.tela, v=S.v[k];
  return `<div class="switch"><button data-act="var" data-n="-1" title="Variante anterior (←)">◀</button><span><small>${NOMETELA[k]}</small>${v} · ${VAR[k][v]}</span><button data-act="var" data-n="1" title="Próxima variante (→)">▶</button></div>`;
}
function mudarVariante(n){
  const k=S.tela, vs=['A','B','C']; S.v[k]=vs[(vs.indexOf(S.v[k])+n+3)%3];
  if(k==='reserva'&&!S.draft) S.draft=novoDraft();
  S.erros=null; S.recusando=null; syncUrl(); render();
}
function estado(){
  const u=uid();
  return `<aside class="estado"><b>ESTADO EM MEMÓRIA</b> · Usuário atual: ${u} (${S.perfil}) · Reservas ativas: ${ativasDe(u).length}
  ${S.suspensoes[u]?` · suspenso até ${S.suspensoes[u]}`:''}
  <h3>draft da Reserva</h3>${S.draft?esc(JSON.stringify(S.draft)):'—'}
  <h3>erros</h3>${S.erros?S.erros.map(e=>e.rn).join(', '):'—'}
  <h3>reservas</h3><table>${S.reservas.map(r=>`<tr class="${ATIVAS.includes(r.status)?'at':''}"><td>${r.id}</td><td>${r.recurso}</td><td>${r.usuario}</td><td>${fDia(r.dia)}</td><td>${hm(r.ini)}–${hm(r.fim)}</td><td>${r.status}</td></tr>`).join('')}</table>
  <h3>notificações</h3>${S.notificacoes.map(n=>`<div>→ ${n.para}: ${esc(n.msg)}</div>`).join('')||'—'}</aside>`;
}

// ---------- eventos ----------
const ACT={
  tab(el){const t=el.dataset.tela;
    if(t==='reserva'){if(!S.draft)S.draft=novoDraft();S.erros=null}
    if(t==='fila'&&S.perfil!=='Gestor'){S.perfil='Gestor';toast('Perfil trocado para Gestor: só o Gestor do Recurso decide os Pedidos (RN13).')}
    S.recusando=null; go(t)},
  estado(){S.mostraEstado=!S.mostraEstado;render()},
  reiniciar(){aplicarCenario(S.cenario);if(S.tela==='reserva')S.draft=novoDraft();toast('Dados reiniciados.');render()},
  var(el){mudarVariante(+el.dataset.n)},
  dia(el){S.diaSel=el.dataset.dia;S.abertoB=null;render()},
  abrirB(el){const i=+el.dataset.ini;S.abertoB=S.abertoB===i?null:i;render()},
  iniB(el){const t=+el.dataset.t;abrirReserva({dia:el.dataset.dia,ini:t,fim:Math.min(t+60,+el.dataset.fim)})},
  prox(el){const t=+el.dataset.t;abrirReserva({dia:el.dataset.dia,ini:t,fim:t+60})},
  barra(el,e){const b=el.getBoundingClientRect(),de=+el.dataset.de,ate=+el.dataset.ate,dia=el.dataset.dia,rec=recurso(S.recursoSel);
    const t=de+Math.floor((e.clientX-b.left)/b.width*(ate-de)/30)*30;
    if(statusCel(rec,dia,t).tipo!=='livre'){toast(`${fDia(dia)} ${hm(t)} não está livre.`);return}
    abrirReserva({dia,ini:t,fim:statusCel(rec,dia,t+30).tipo==='livre'?t+60:t+30})},
  cancelar(){S.draft=null;S.erros=null;go('agenda')},
  fecharFundo(el,e){if(e.target===el)ACT.cancelar()},
  enviar(){enviar()},
  mover(el){const n=+el.dataset.n;S.draft.ini+=n;S.draft.fim+=n;S.erros=null;render()},
  dur(el){const n=+el.dataset.n;if(S.draft.fim+n>S.draft.ini){S.draft.fim+=n;S.erros=null;render()}},
  sug(el){Object.assign(S.draft,{dia:el.dataset.dia,ini:+el.dataset.ini,fim:+el.dataset.fim});if(SEMANA.includes(el.dataset.dia))S.diaSel=el.dataset.dia;S.erros=null;render()},
  aprovar(el){aprovar(+el.dataset.id);render()},
  recusar(el){S.recusando=+el.dataset.id;S.justTxt='';render()},
  cancRecusa(){S.recusando=null;render()},
  confRecusa(el){recusar(+el.dataset.id)},
  just(el){S.justTxt=el.dataset.txt;render()},
  selA(el){const id=+el.dataset.id;el.checked?S.selA.add(id):S.selA.delete(id);render()},
  selTodos(el){if(el.checked)pedidos().forEach(r=>S.selA.add(r.id));else S.selA.clear();render()},
  aprovarSel(){const ids=[...S.selA];ids.forEach(id=>aprovar(id,true));toast(`${ids.length} Pedido${ids.length>1?'s aprovados':' aprovado'}; os solicitantes foram notificados.`,'verde');render()},
  pedSel(el){S.pedSel=+el.dataset.id;S.recusando=null;render()},
  pular(){S.triIdx=(S.triIdx+1)%pedidos().length;S.recusando=null;render()},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&ACT[el.dataset.act])ACT[el.dataset.act](el,e)});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches('textarea[data-just]')){S.justTxt=t.value;const b=document.querySelector('[data-act=confRecusa]');if(b)b.disabled=!t.value.trim();return}
  const c=t.dataset.campo;
  if(c){let v=t.value;if(c==='dia'&&!v)return;if(c==='ini'||c==='fim')v=+v;S.draft[c]=v;
    if(c==='recurso'){S.recursoSel=v;S.erros=null;render();return}
    if(S.v.reserva==='B'&&S.tela==='reserva'){document.getElementById('checklist').innerHTML=checklist();document.getElementById('resultado').innerHTML=resultadoB()}
    return}
  const k=t.dataset.ctl;
  if(k==='perfil'){S.perfil=t.value;S.recusando=null;if(S.tela==='fila'&&t.value!=='Gestor')S.tela='agenda';syncUrl();render()}
  if(k==='cenario'){aplicarCenario(t.value);if(t.value!=='normal')S.perfil='Aluno';if(S.tela==='reserva')S.draft=novoDraft();syncUrl();render()}
  if(k==='recurso'){S.recursoSel=t.value;S.abertoB=null;if(S.draft){S.draft.recurso=t.value;S.erros=null}render()}
});
document.addEventListener('keydown',e=>{
  const f=document.activeElement;
  if(f&&(f.matches('input,textarea,select')||f.isContentEditable))return;
  if(e.key==='ArrowLeft')mudarVariante(-1);
  if(e.key==='ArrowRight')mudarVariante(1);
  if(S.tela==='fila'&&S.v.fila==='C'&&!S.recusando&&pedidos().length){
    const r=pedidos()[Math.min(S.triIdx,pedidos().length-1)];
    if(e.key==='a'){aprovar(r.id);render()} if(e.key==='r'){S.recusando=r.id;S.justTxt='';render()} if(e.key==='p')ACT.pular();
  }
});
// arrastar na grade (agenda A)
let arr=null;
const celLivre=(dia,t)=>!!document.querySelector(`td[data-livre][data-dia="${dia}"][data-t="${t}"]`);
function pintar(){document.querySelectorAll('td[data-livre]').forEach(td=>{const t=+td.dataset.t;td.classList.toggle('c-arr',!!arr&&td.dataset.dia===arr.dia&&t>=arr.ini&&t<arr.fim)})}
document.addEventListener('pointerdown',e=>{const td=e.target.closest('td[data-livre]');if(!td)return;e.preventDefault();const t=+td.dataset.t;arr={dia:td.dataset.dia,anc:t,ini:t,fim:t+30,moveu:false};pintar()});
document.addEventListener('pointermove',e=>{if(!arr)return;const el=document.elementFromPoint(e.clientX,e.clientY),td=el&&el.closest('td[data-livre]');if(!td||td.dataset.dia!==arr.dia)return;
  const t=+td.dataset.t,ini=Math.min(arr.anc,t),fim=Math.max(arr.anc,t)+30;for(let x=ini;x<fim;x+=30)if(!celLivre(arr.dia,x))return;
  if(ini!==arr.ini||fim!==arr.fim){arr.ini=ini;arr.fim=fim;arr.moveu=true;pintar()}});
document.addEventListener('pointerup',()=>{if(!arr)return;let{dia,ini,fim,moveu}=arr;arr=null;if(!moveu&&celLivre(dia,ini+30))fim=ini+60;abrirReserva({dia,ini,fim})});

render();
</script>
</body>
