name: Deploy

# Publicação contínua a cada merge na main (spec §7, tickets #15 e #30).
# Roda todo o CI antes de chamar o deploy hook do Render, aguarda a nova versão
# responder no health check e registra um GitHub Deployment no ambiente producao.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml

  deploy:
    name: deploy
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: producao
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Criar GitHub Deployment
        id: deployment
        run: |
          DEPLOYMENT_ID=$(gh api repos/${{ github.repository }}/deployments \
            -f ref=${{ github.sha }} \
            -f environment=producao \
            -f description="Deploy contínuo no Render" \
            -F auto_merge=false \
            -F 'required_contexts[]' \
            --jq .id)
          echo "id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

          gh api repos/${{ github.repository }}/deployments/$DEPLOYMENT_ID/statuses \
            -f state=in_progress \
            -f environment=producao \
            ${APP_URL:+-f environment_url="$APP_URL"} \
            -f description="Deploy disparado no Render"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_URL: ${{ vars.APP_URL }}

      - name: Disparar deploy hook no Render
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL não configurada no ambiente producao."
            exit 1
          fi
          curl -sS -f -X POST "${RENDER_DEPLOY_HOOK_URL}"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      - name: Aguardar versão nova responder no health
        run: node .github/scripts/esperar-deploy.js
        env:
          APP_URL: ${{ vars.APP_URL }}
          EXPECTED_SHA: ${{ github.sha }}
          TIMEOUT_MINUTOS: 15

      - name: Registrar sucesso no GitHub Deployment
        if: success()
        run: |
          gh api repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.id }}/statuses \
            -f state=success \
            -f environment=producao \
            ${APP_URL:+-f environment_url="$APP_URL"} \
            -f description="Publicado com sucesso"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_URL: ${{ vars.APP_URL }}

      - name: Registrar falha no GitHub Deployment
        if: failure() && steps.deployment.outputs.id != ''
        run: |
          gh api repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.id }}/statuses \
            -f state=failure \
            -f environment=producao \
            ${APP_URL:+-f environment_url="$APP_URL"} \
            -f description="Falha no deploy ou no health check"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_URL: ${{ vars.APP_URL }}
